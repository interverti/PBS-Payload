version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
  # Keeps pyproject.toml and uv.lock (the capstone test dependency) current.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  # Keeps the uv version used by setup-uv current (.github/uv/requirements.txt).
  - package-ecosystem: pip
    directory: /.github/uv
    schedule:
      interval: weekly
