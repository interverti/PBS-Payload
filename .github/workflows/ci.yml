name: CI

# Compile and run the offline unit tests. Never publishes a release and never
# contacts a console.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are cancelled; a quick second push to master must not cancel
  # the first commit's result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Pull requests from forks wait for a required reviewer on the `fork-pr`
    # environment (Settings > Environments). Everything else uses `internal`,
    # which has no protection rules. `pull_request` (not `_target`) means fork
    # code gets a read-only token and no secrets.
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' && 'fork-pr' || 'internal' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: .github/uv/requirements.txt

      - name: SDK installer and ELF verifier tests
        run: |
          uv run --locked --group test python -m unittest discover -s tests -p test_install_sdk.py
          uv run --locked --group test python -m unittest discover -s tests -p test_verify_ps5_elf.py

      - name: Compile and run the host regression (C, C++, Node, Python)
        # uv puts the locked env first on PATH so the script's python3 has capstone.
        run: uv run --locked --group test bash tools/test_ps4_host.sh

      - name: PS5 firmware audit tests
        run: uv run --locked --group test python -m unittest discover -s tests/ps5 -p test_firmware_audit.py -v

      - name: PS5 9.40 diagnostics matrix
        run: sh tests/ps5/run_940_diagnostics.sh

  payload:
    name: ${{ matrix.platform }} payload build (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' && 'fork-pr' || 'internal' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ps4
            artifact: payload/build/ps4/pbs-remote-stream.elf
            avcap: "1"
            sdk_url: ${{ vars.PS4_PAYLOAD_SDK_URL }}
            sdk_repo: ${{ vars.PS4_PAYLOAD_SDK_REPO }}
            sdk_ref: ${{ vars.PS4_PAYLOAD_SDK_REF }}
          - platform: ps5
            artifact: payload/build/ps5/pbs.elf
            sdk_url: ${{ vars.PS5_PAYLOAD_SDK_URL }}
            sdk_repo: ${{ vars.PS5_PAYLOAD_SDK_REPO }}
            sdk_ref: ${{ vars.PS5_PAYLOAD_SDK_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Payload SDK
        uses: ./.github/actions/payload-sdk
        with:
          platform: ${{ matrix.platform }}
          url: ${{ matrix.sdk_url }}
          repo: ${{ matrix.sdk_repo }}
          ref: ${{ matrix.sdk_ref }}

      - name: Build the ${{ matrix.platform }} payload
        env:
          PBS_PS4_REMOTE_AVCAP: ${{ matrix.avcap }}
        run: bash payload/build.sh ${{ matrix.platform }} stream

      - name: Check the ELF
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          test -s "$ARTIFACT"
          file "$ARTIFACT" | grep -q 'ELF 64-bit'
          sha256sum "$ARTIFACT"
